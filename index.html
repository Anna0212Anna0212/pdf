<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 頁面工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#dde3da;--panel:#f6f6f1;--ink:#1c2b30;--mute:#5d6b6f;--line:#c3cbc1;--acc:#0e6e8c;--danger:#b3261e;--w:130px}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700}
header .sub{font-size:12px;opacity:.7}.sp{flex:1}
button,.btn,select,input[type=text],input:not([type]),input[type=number]{font:inherit;color:inherit}
button,.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
header button,header .btn{background:#2b3d43;border-color:#3f545b;color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}header button.pri{background:var(--acc)}
button.dz{color:var(--danger)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;min-height:0;display:flex;gap:10px;padding:10px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0}
#L{flex:0 0 38%}#R{flex:1}
h2{font-size:13px;margin:0;padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.scroll{overflow:auto;flex:1;padding:10px}
details{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
summary{cursor:pointer;padding:6px 10px;display:flex;gap:8px;align-items:center}
summary .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
summary em{font-style:normal;color:var(--mute);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.sb{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;border-top:1px solid var(--line);align-items:center}
.sb input{width:130px;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w),1fr));gap:8px;padding:8px 10px}
.card{position:relative;background:#fff;border:2px solid var(--line);border-radius:6px;padding:4px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 180px;user-select:none}
.card .tag{position:absolute;left:-2px;top:-2px;right:-2px;height:5px;border-radius:6px 6px 0 0}
.card .th{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:#eceee9;overflow:hidden;margin-top:3px}
.card img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;transition:transform .15s}
.card .blank{width:80%;height:85%;background:#fff;border:1px dashed var(--mute);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.card b{display:block;text-align:center;font-size:12px}
.card small{display:block;text-align:center;color:var(--mute);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.card.on::after{content:"✓";position:absolute;right:4px;top:10px;background:var(--acc);color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;text-align:center;line-height:18px}
.card.ib{box-shadow:-5px 0 0 var(--danger)}.card.ia{box-shadow:5px 0 0 var(--danger)}
#tabs{display:flex;gap:4px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;align-items:flex-end}
#tabs button{border-radius:6px 6px 0 0;border-bottom:none;white-space:nowrap;background:#e8ebe5}
#tabs button.on{background:#fff;font-weight:700;border-color:var(--acc)}#tabs button.dr{background:#cfe9f1}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
#bar input[type=text]{width:110px;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
#bar .gp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
#bar select{padding:3px;border:1px solid var(--line);border-radius:6px}
.empty{color:var(--mute);text-align:center;padding:40px 16px;border:2px dashed var(--line);border-radius:8px}
dialog{border:1px solid var(--line);border-radius:10px;padding:16px;max-width:min(560px,94vw);color:var(--ink)}
dialog::backdrop{background:rgba(20,30,34,.5)}
dialog h3{margin:0 0 8px}dialog label{display:block;margin:6px 0}
#xl{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
#pv{max-width:94vw}#pv canvas{max-width:100%;max-height:80vh}
.hint{color:var(--mute);font-size:12px}
@media(max-width:800px){main{flex-direction:column}#L{flex:0 0 38%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>PDF 頁面工作台</h1><span class="sub">檔案只在你的瀏覽器內處理，不會上傳</span><span class="sp"></span>
  <button id="undo" title="復原 Ctrl+Z">↶ 復原</button><button id="redo" title="重做 Ctrl+Y">↷ 重做</button>
  <label class="btn">＋ 加入 PDF<input id="file" type="file" accept="application/pdf" multiple hidden></label>
  <button id="exp" class="pri">匯出…</button>
</header>
<main>
  <section id="L"><h2>來源檔案 <span class="hint">點頁面選取，再「加入選取」；或直接拖到右邊</span></h2><div id="srcs" class="scroll"></div></section>
  <section id="R">
    <div id="tabs"></div>
    <div id="bar">
      <span class="gp"><button data-a="all">全選</button><button data-a="none">取消</button><button data-a="inv">反選</button><button data-a="odd">奇數頁</button><button data-a="even">偶數頁</button>
        <input type="text" id="rng" placeholder="選頁碼 如 1-5,9" title="輸入後按 Enter"></span>
      <span class="gp"><button data-a="dup">複製</button><button data-a="del" class="dz">刪除</button><button data-a="rl">↺</button><button data-a="rr">↻</button><button data-a="blank">插入空白頁</button></span>
      <span class="gp"><button data-a="first">⇤ 最前</button><button data-a="left">←</button><button data-a="right">→</button><button data-a="last">最後 ⇥</button><button data-a="rev">反轉順序</button></span>
      <span class="gp"><select id="to"></select><button data-a="copy">複製過去</button><button data-a="move">移動過去</button></span>
      <label class="hint">縮圖 <input type="range" id="zoom" min="90" max="260" value="130"></label>
      <span id="cnt" class="hint"></span>
    </div>
    <div id="grid" class="scroll"></div>
  </section>
</main>

<dialog id="xd">
  <h3>匯出</h3>
  <div class="hint">勾選要匯出的輸出檔：</div><div id="xl"></div>
  <label><input type="radio" name="xm" id="xsep" checked> 每個輸出各自一個 PDF</label>
  <label><input type="radio" name="xm" id="xm"> 全部合併成一個 PDF　檔名 <input type="text" id="xname" value="合併" size="14"></label>
  <label>每 <input type="number" id="xn" min="0" value="0" style="width:64px"> 頁切成一個檔案（0＝不切）</label>
  <label><input type="checkbox" id="xs"> 目前輸出只匯出已選取的頁面</label>
  <label><input type="checkbox" id="xz" checked> 多個檔案時打包成 ZIP</label>
  <div id="xp" class="hint" style="min-height:22px"></div>
  <div style="text-align:right"><button id="xc">關閉</button> <button id="xgo" class="pri">開始匯出</button></div>
</dialog>
<dialog id="pv"><canvas id="pc"></canvas><div style="text-align:right;margin-top:8px"><button id="pcl">關閉</button></div></dialog>

<script>
const $=s=>document.querySelector(s),COL=['#e07a5f','#3d8fb0','#81b29a','#c9a227','#8e6bbf','#d1617a','#4f9d69','#7a8b99'];
const S={src:{},outs:[],cur:0,hist:[],fut:[]},TC={},selO=new Set(),selS={},lastS={};
let uid=1,D=null,nOut=0,lastO=null,dropIdx=-1,nSrc=0;
const O=()=>S.outs[S.cur], sel=()=>O().pages.filter(p=>selO.has(p.u));
const WURL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const ready=fetch(WURL).then(r=>r.blob()).then(b=>{pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b)});

/* ---------- 歷史 ---------- */
const dump=()=>JSON.stringify([S.outs,S.cur]);
function snap(){S.hist.push(dump());if(S.hist.length>100)S.hist.shift();S.fut=[]}
function load(j){[S.outs,S.cur]=JSON.parse(j);selO.clear();drawOut()}
function undo(){if(!S.hist.length)return;S.fut.push(dump());load(S.hist.pop())}
function redo(){if(!S.fut.length)return;S.hist.push(dump());load(S.fut.pop())}
function newOut(){S.outs.push({n:'輸出 '+(++nOut),pages:[]});S.cur=S.outs.length-1}

/* ---------- 縮圖佇列（大量頁數時只渲染可見範圍） ---------- */
const Q=[];let run=0;
function pump(){while(run<3&&Q.length){run++;Q.shift()().catch(()=>{}).finally(()=>{run--;pump()})}}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);thumb(e.target)}}),{rootMargin:'700px'});
function thumb(img){const {s,p}=img.dataset,k=s+':'+p;if(TC[k]){img.src=TC[k];return}
  Q.push(async()=>{const pg=await S.src[s].doc.getPage(+p+1),v=pg.getViewport({scale:1}),vp=pg.getViewport({scale:240/v.width});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));TC[k]=URL.createObjectURL(b);img.src=TC[k]});pump()}

/* ---------- 工具 ---------- */
function parseRange(t,max){const r=new Set();String(t).replace(/，/g,',').split(',').forEach(x=>{const m=x.trim().match(/^(\d+)(?:\s*[-~]\s*(\d+))?$/);if(!m)return;let a=+m[1],b=+(m[2]||m[1]);if(a>b)[a,b]=[b,a];for(let i=Math.max(1,a);i<=Math.min(max,b);i++)r.add(i-1)});return [...r].sort((a,b)=>a-b)}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 載入檔案 ---------- */
async function addFiles(fs){await ready;
  for(const f of fs){if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')continue;
    try{const bytes=await f.arrayBuffer(),doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise,id='f'+(uid++);
      S.src[id]={id,name:f.name,bytes,doc,n:doc.numPages,c:COL[nSrc++%8],open:Object.keys(S.src).length===0};selS[id]=new Set()}
    catch(e){alert(e&&e.name==='PasswordException'?f.name+' 有密碼保護，請先解除密碼再載入。':f.name+' 無法讀取。')}}
  drawSrc();drawOut()}

/* ---------- 左：來源 ---------- */
function drawSrc(){const el=$('#srcs'),a=Object.values(S.src);
  if(!a.length){el.innerHTML='<div class="empty">把 PDF 拖進來，或按右上角「＋ 加入 PDF」<br>可一次加入多個檔案</div>';return}
  el.innerHTML=a.map(s=>`<details data-s="${s.id}" ${s.open?'open':''}><summary><i class="dot" style="background:${s.c}"></i><span class="nm" title="${esc(s.name)}">${esc(s.name)}</span><em>${s.n} 頁</em></summary>
  <div class="sb"><input type="text" placeholder="頁碼 如 1-5,8"><button data-a="addr">加入範圍</button><button data-a="adds">加入選取(<span class="sc">0</span>)</button><button data-a="addall">整份加入</button><button data-a="sall">全選</button><button data-a="snone">清除</button><button data-a="rm" class="dz">移除檔案</button></div><div class="g"></div></details>`).join('');
  el.querySelectorAll('details').forEach(d=>{const fill=()=>{const s=S.src[d.dataset.s];s.open=d.open;const g=d.querySelector('.g');if(d.open&&!g.children.length){g.innerHTML=Array.from({length:s.n},(_,i)=>`<div class="card" draggable="true" data-s="${s.id}" data-p="${i}"><i class="tag" style="background:${s.c}"></i><div class="th"><img data-s="${s.id}" data-p="${i}" alt=""></div><b>${i+1}</b></div>`).join('');g.querySelectorAll('img').forEach(i=>io.observe(i));refSrc(s.id)}};
    d.addEventListener('toggle',fill);fill()})}
function refSrc(id){const d=document.querySelector(`details[data-s="${id}"]`);if(!d)return;d.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',selS[id].has(+c.dataset.p)));d.querySelector('.sc').textContent=selS[id].size}

$('#srcs').addEventListener('click',e=>{
  const c=e.target.closest('.card');
  if(c){const id=c.dataset.s,p=+c.dataset.p,st=selS[id];
    if(e.shiftKey&&lastS[id]!=null){const[a,b]=[lastS[id],p].sort((x,y)=>x-y);for(let i=a;i<=b;i++)st.add(i)}else st.has(p)?st.delete(p):st.add(p);
    lastS[id]=p;refSrc(id);return}
  const b=e.target.closest('button[data-a]');if(!b)return;
  const d=b.closest('details'),id=d.dataset.s,s=S.src[id],st=selS[id],a=b.dataset.a;
  if(a==='sall'){for(let i=0;i<s.n;i++)st.add(i);refSrc(id)}
  else if(a==='snone'){st.clear();refSrc(id)}
  else if(a==='rm'){if(!confirm('移除此檔案？輸出中來自此檔案的頁面也會一併移除。'))return;snap();S.outs.forEach(o=>o.pages=o.pages.filter(p=>p.s!==id));delete S.src[id];selO.clear();drawSrc();drawOut()}
  else{let ps=a==='addall'?[...Array(s.n).keys()]:a==='adds'?[...st].sort((x,y)=>x-y):parseRange(d.querySelector('.sb input').value,s.n);
    if(!ps.length)return alert('沒有選到頁面');insertPages(ps.map(p=>({s:id,p})),null)}});
$('#srcs').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.sb input'))e.target.closest('.sb').querySelector('[data-a=addr]').click()});

/* ---------- 右：輸出 ---------- */
function insertPages(items,idx){snap();const o=O();
  if(idx==null){const i=o.pages.map((p,i)=>selO.has(p.u)?i:-1).filter(i=>i>=0);idx=i.length?i[i.length-1]+1:o.pages.length}
  const np=items.map(x=>({u:uid++,s:x.s,p:x.p,r:x.r||0}));o.pages.splice(idx,0,...np);selO.clear();np.forEach(p=>selO.add(p.u));drawOut()}
function drawOut(){
  $('#tabs').innerHTML=S.outs.map((o,i)=>`<button data-i="${i}" class="${i===S.cur?'on':''}" title="雙擊改名；可把頁面拖到分頁上複製過去">${esc(o.n)} (${o.pages.length})</button>`).join('')+'<button data-i="new">＋ 新增輸出</button>'+(S.outs.length>1?'<button data-i="del" class="dz">刪除此輸出</button>':'');
  $('#to').innerHTML=S.outs.map((o,i)=>i===S.cur?'':`<option value="${i}">${esc(o.n)}</option>`).join('')||'<option value="">（先新增另一個輸出）</option>';
  const g=$('#grid'),o=O();
  g.className='scroll g';g.style.alignContent='start';
  g.innerHTML=o.pages.length?o.pages.map((p,i)=>cardHTML(p,i)).join(''):'<div class="empty" style="grid-column:1/-1">這個輸出還是空的<br>從左邊選頁面加入，或把頁面拖到這裡</div>';
  g.querySelectorAll('img').forEach(i=>io.observe(i));refOut()}
function cardHTML(p,i){const s=S.src[p.s],rot=p.r?`style="transform:rotate(${p.r}deg)${p.r%180?' scale(.72)':''}"`:'';
  return `<div class="card" draggable="true" data-u="${p.u}"><i class="tag" style="background:${s?s.c:'#bbb'}"></i><div class="th">${s?`<img data-s="${p.s}" data-p="${p.p}" ${rot} alt="">`:`<div class="blank" ${rot}>空白頁</div>`}</div><b>${i+1}</b><small>${s?esc(s.name)+' · p.'+(p.p+1):'空白'}</small></div>`}
function refOut(){$('#grid').querySelectorAll('.card').forEach(c=>c.classList.toggle('on',selO.has(+c.dataset.u)));$('#cnt').textContent=`共 ${O().pages.length} 頁，已選 ${selO.size}`;$('#undo').disabled=!S.hist.length;$('#redo').disabled=!S.fut.length}

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=b.dataset.i;
  if(i==='new'){snap();newOut();selO.clear();drawOut()}
  else if(i==='del'){if(O().pages.length&&!confirm('刪除「'+O().n+'」？'))return;snap();S.outs.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);selO.clear();drawOut()}
  else{S.cur=+i;selO.clear();drawOut()}});
$('#tabs').addEventListener('dblclick',e=>{const b=e.target.closest('button');if(!b||isNaN(b.dataset.i))return;const n=prompt('輸出名稱（也是匯出檔名）：',S.outs[b.dataset.i].n);if(n&&n.trim()){snap();S.outs[b.dataset.i].n=n.trim();drawOut()}});

$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const u=+c.dataset.u,ps=O().pages;
  if(e.shiftKey&&lastO!=null){const a=ps.findIndex(p=>p.u===lastO),b=ps.findIndex(p=>p.u===u);if(a>=0)for(let i=Math.min(a,b);i<=Math.max(a,b);i++)selO.add(ps[i].u)}
  else selO.has(u)?selO.delete(u):selO.add(u);lastO=u;refOut()});
document.addEventListener('dblclick',e=>{const c=e.target.closest('.card');if(!c)return;let s,p;if(c.dataset.u){const x=O().pages.find(q=>q.u==c.dataset.u);if(!x||!x.s)return;s=x.s;p=x.p}else{s=c.dataset.s;p=+c.dataset.p}preview(s,p)});
async function preview(s,p){const pg=await S.src[s].doc.getPage(p+1),vp=pg.getViewport({scale:1.6}),c=$('#pc');c.width=vp.width;c.height=vp.height;$('#pv').showModal();await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
$('#pcl').onclick=()=>$('#pv').close();

/* ---------- 操作 ---------- */
$('#bar').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b)act(b.dataset.a)});
$('#rng').addEventListener('keydown',e=>{if(e.key==='Enter'){const ps=O().pages;selO.clear();parseRange(e.target.value,ps.length).forEach(i=>selO.add(ps[i].u));refOut()}});
$('#zoom').oninput=e=>document.documentElement.style.setProperty('--w',e.target.value+'px');
function act(a){const o=O(),ps=o.pages,idx=ps.map((p,i)=>selO.has(p.u)?i:-1).filter(i=>i>=0);
  if(a==='all'){ps.forEach(p=>selO.add(p.u));return refOut()}
  if(a==='none'){selO.clear();return refOut()}
  if(a==='inv'){ps.forEach(p=>selO.has(p.u)?selO.delete(p.u):selO.add(p.u));return refOut()}
  if(a==='odd'||a==='even'){selO.clear();ps.forEach((p,i)=>{if((i%2===0)===(a==='odd'))selO.add(p.u)});return refOut()}
  if(!idx.length&&a!=='rev'&&a!=='blank')return alert('請先選取頁面');
  if(a==='copy'||a==='move'){const t=S.outs[+$('#to').value];if(!t)return alert('請先新增另一個輸出');snap();t.pages.push(...sel().map(p=>({...p,u:uid++})));if(a==='move'){o.pages=ps.filter(p=>!selO.has(p.u));selO.clear()}return drawOut()}
  snap();
  if(a==='dup'){const n=[];ps.forEach(p=>{n.push(p);if(selO.has(p.u))n.push({...p,u:uid++})});o.pages=n}
  else if(a==='del'){o.pages=ps.filter(p=>!selO.has(p.u));selO.clear()}
  else if(a==='rl'||a==='rr'){ps.forEach(p=>{if(selO.has(p.u))p.r=(p.r+(a==='rr'?90:270))%360})}
  else if(a==='first'||a==='last'){const s=ps.filter(p=>selO.has(p.u)),r=ps.filter(p=>!selO.has(p.u));o.pages=a==='first'?[...s,...r]:[...r,...s]}
  else if(a==='left'){for(let i=1;i<ps.length;i++)if(selO.has(ps[i].u)&&!selO.has(ps[i-1].u))[ps[i-1],ps[i]]=[ps[i],ps[i-1]]}
  else if(a==='right'){for(let i=ps.length-2;i>=0;i--)if(selO.has(ps[i].u)&&!selO.has(ps[i+1].u))[ps[i+1],ps[i]]=[ps[i],ps[i+1]]}
  else if(a==='rev'){const ix=idx.length?idx:ps.map((_,i)=>i),v=ix.map(i=>ps[i]).reverse();ix.forEach((i,k)=>ps[i]=v[k])}
  else if(a==='blank'){const at=idx.length?idx[idx.length-1]+1:ps.length,b={u:uid++,s:null,p:0,r:0};ps.splice(at,0,b);selO.clear();selO.add(b.u)}
  drawOut()}
$('#undo').onclick=undo;$('#redo').onclick=redo;
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||document.querySelector('dialog[open]'))return;
  const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
  if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(m&&k==='y'){e.preventDefault();redo()}
  else if(m&&k==='a'){e.preventDefault();act('all')}else if(m&&k==='d'){e.preventDefault();act('dup')}
  else if(k==='delete'||k==='backspace'){if(selO.size)act('del')}});

/* ---------- 拖放（來源→輸出、輸出內排序、拖到分頁複製） ---------- */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;
  if(c.dataset.u){const u=+c.dataset.u;if(!selO.has(u)){selO.clear();selO.add(u);refOut()}D={from:'out',us:new Set(selO)}}
  else{const id=c.dataset.s,p=+c.dataset.p,st=selS[id];D={from:'src',items:(st.has(p)?[...st].sort((a,b)=>a-b):[p]).map(x=>({s:id,p:x}))}}
  e.dataTransfer.effectAllowed='copyMove';e.dataTransfer.setData('text/plain','pdf')});
document.addEventListener('dragend',()=>{D=null;clearIns()});
function clearIns(){document.querySelectorAll('.ib,.ia').forEach(x=>x.classList.remove('ib','ia'));document.querySelectorAll('.dr').forEach(x=>x.classList.remove('dr'))}
$('#grid').addEventListener('dragover',e=>{e.preventDefault();clearIns();const c=e.target.closest('.card'),ps=O().pages;
  if(!c){dropIdx=ps.length;const l=$('#grid').lastElementChild;if(l&&l.classList.contains('card'))l.classList.add('ia');return}
  const i=ps.findIndex(p=>p.u==c.dataset.u),r=c.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;dropIdx=i+(after?1:0);c.classList.add(after?'ia':'ib')});
$('#grid').addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();clearIns();
  if(e.dataTransfer.files.length&&!D)return addFiles(e.dataTransfer.files);
  if(!D)return;const o=O();
  if(D.from==='src')insertPages(D.items,dropIdx);
  else{snap();const mv=o.pages.filter(p=>D.us.has(p.u));let at=dropIdx-o.pages.slice(0,dropIdx).filter(p=>D.us.has(p.u)).length;
    const rest=o.pages.filter(p=>!D.us.has(p.u));rest.splice(at,0,...mv);o.pages=rest;drawOut()}
  D=null});
$('#tabs').addEventListener('dragover',e=>{const b=e.target.closest('button');if(b&&!isNaN(b.dataset.i)&&+b.dataset.i!==S.cur&&D){e.preventDefault();clearIns();b.classList.add('dr')}});
$('#tabs').addEventListener('drop',e=>{const b=e.target.closest('button');if(!b||isNaN(b.dataset.i)||!D)return;e.preventDefault();e.stopPropagation();clearIns();
  const t=S.outs[+b.dataset.i];snap();
  t.pages.push(...(D.from==='src'?D.items.map(x=>({u:uid++,s:x.s,p:x.p,r:0})):O().pages.filter(p=>D.us.has(p.u)).map(p=>({...p,u:uid++}))));D=null;drawOut()});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length&&!D)addFiles(e.dataTransfer.files)});
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
window.addEventListener('beforeunload',e=>{if(S.outs.some(o=>o.pages.length)){e.preventDefault();e.returnValue=''}});

/* ---------- 匯出 ---------- */
$('#exp').onclick=()=>{$('#xl').innerHTML=S.outs.map((o,i)=>`<label><input type="checkbox" value="${i}" ${i===S.cur?'checked':''}> ${esc(o.n)}（${o.pages.length} 頁）</label>`).join('');$('#xp').textContent='';$('#xd').showModal()};
$('#xc').onclick=()=>$('#xd').close();
async function build(pages,title){const L=PDFLib,doc=await L.PDFDocument.create(),by={},ptr={},cp={};
  pages.forEach(x=>{if(x.s)(by[x.s]=by[x.s]||[]).push(x.p)});
  for(const s in by){const d=await L.PDFDocument.load(S.src[s].bytes,{ignoreEncryption:true});cp[s]=await doc.copyPages(d,by[s])}
  for(const x of pages){let pg;
    if(x.s){const k=ptr[x.s]=(ptr[x.s]===undefined?0:ptr[x.s]+1);pg=cp[x.s][k];doc.addPage(pg)}else pg=doc.addPage([595.28,841.89]);
    if(x.r)pg.setRotation(L.degrees((pg.getRotation().angle+x.r)%360))}
  doc.setTitle(title);return doc.save()}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const safe=n=>n.replace(/[\\/:*?"<>|]/g,'_');
$('#xgo').onclick=async()=>{
  const picks=[...document.querySelectorAll('#xl input:checked')].map(i=>S.outs[+i.value]);if(!picks.length)return alert('請至少勾選一個輸出');
  const merged=$('#xm').checked,n=+$('#xn').value||0,onlySel=$('#xs').checked;
  const chunks=(pgs,base)=>n>0&&pgs.length>n?Array.from({length:Math.ceil(pgs.length/n)},(_,i)=>({name:base+'_'+String(i+1).padStart(2,'0'),pages:pgs.slice(i*n,(i+1)*n)})):[{name:base,pages:pgs}];
  let jobs=[];
  if(merged)jobs=chunks(picks.flatMap(o=>o.pages),$('#xname').value||'合併');
  else picks.forEach(o=>jobs.push(...chunks(onlySel&&o===O()&&selO.size?sel():o.pages,o.n)));
  jobs=jobs.filter(j=>j.pages.length);if(!jobs.length)return alert('沒有可匯出的頁面');
  $('#xgo').disabled=true;const zip=jobs.length>1&&$('#xz').checked?new JSZip():null;
  try{for(let i=0;i<jobs.length;i++){$('#xp').textContent=`處理中 ${i+1}/${jobs.length}：${jobs[i].name}（${jobs[i].pages.length} 頁）`;await new Promise(r=>setTimeout(r,20));
      const bytes=await build(jobs[i].pages,jobs[i].name),fn=safe(jobs[i].name)+'.pdf';
      if(zip)zip.file(fn,bytes);else{dl(new Blob([bytes],{type:'application/pdf'}),fn);if(jobs.length>1)await new Promise(r=>setTimeout(r,400))}}
    if(zip){$('#xp').textContent='打包 ZIP…';dl(await zip.generateAsync({type:'blob'}),'pdf-output.zip')}
    $('#xp').textContent='完成 ✓ 已開始下載'}
  catch(e){console.error(e);$('#xp').textContent='匯出失敗：'+e.message}
  $('#xgo').disabled=false};

newOut();drawSrc();drawOut();
</script>
